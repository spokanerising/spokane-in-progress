name: Sheet import check (one-off)

# Phase 0 of the editor (issue #1). Runs only on the editor-phase-0 branch:
#  1. copies the Google Sheet's rows into data/projects/ (first run only),
#  2. builds the site twice, with main's code + the sheet and with this
#     branch's code + data/projects/, and
#  3. checks the two projects.json files match.
# Removed before the branch is merged.

on:
  push:
    branches: [editor-phase-0]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sheet-import-check
  cancel-in-progress: false

env:
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTVMhbLFK8Gl1Uc3siqKq6kim0RT8JTYTmIAR5IR3D9uJzNF3qoRLPUdhwTixHpoGLQ2cZIm3aiyg7r/pub?gid=883083305&single=true&output=csv"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: main
          path: old

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Copy the sheet into data/projects/
        run: python3 tools/import_sheet.py "$SHEET_CSV_URL"

      - name: Build with main's code and the sheet
        run: cd old && python3 build.py | tee ../old-build.log

      - name: Build with this branch's code and data/projects/
        run: python3 build.py | tee new-build.log

      - name: Compare
        id: compare
        continue-on-error: true
        run: python3 tools/compare_builds.py old/projects.json projects.json | tee compare.txt

      - uses: actions/upload-artifact@v4
        with:
          name: sheet-import-check
          path: |
            compare.txt
            old-build.log
            new-build.log
            old/projects.json
            projects.json
            data/projects/

      - name: Save data/projects/ to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/projects
          git diff --staged --quiet && exit 0
          git commit -m "Import the Google Sheet into data/projects/"
          git push origin HEAD:editor-phase-0

      - name: Fail if the builds differ
        if: steps.compare.outcome == 'failure'
        run: exit 1
