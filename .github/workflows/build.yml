name: Refresh project data

on:
  workflow_dispatch:        # the "Run workflow" button
  schedule:
    - cron: "0 12 * * *"    # every day, about 5am Pacific
  push:                     # a permit report was uploaded, or a project was
    branches: [main]        # added or edited (data/projects/, data/edits/)
    paths:
      - "permit-reports/**"
      - "data/projects/**"
      - "data/edits/**"

permissions:
  contents: write

# One run at a time, so two uploads close together don't trip over each other.
concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unit counts and job values from the weekly permit report PDFs in
      # permit-reports/. If this step has a problem, the sheet still gets
      # published below.
      - name: Read the weekly permit reports
        continue-on-error: true
        run: |
          pip install --quiet pdfplumber pikepdf openpyxl
          python3 permit_reports.py

      # Poppler draws thumbnails of linked design PDFs (pdf_thumbs.py).
      # Without it the PDFs are still linked, just without a picture.
      - name: Install poppler
        continue-on-error: true
        run: sudo apt-get install -y --no-install-recommends poppler-utils

      - run: python3 build.py

      # Share images: a card per project (only new or changed ones are drawn)
      # and the site-wide card. Drawn in a headless browser with the site's
      # typefaces. If this step has a problem, the data still publishes and
      # the pages fall back to the site-wide card.
      # Most refreshes change no card, so check first and skip installing
      # the browser then (issue #41). If the check itself fails, draw anyway.
      - name: Anything to draw?
        id: cards
        continue-on-error: true
        run: python3 cards.py --needed >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.cards.outputs.draw != 'false'
        with:
          node-version: "20"
      - name: Draw the share cards
        if: steps.cards.outputs.draw != 'false'
        continue-on-error: true
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium
          python3 cards.py

      - name: Save the new data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add projects.json data/
          for f in boundaries.geojson sitemap.xml og-card.png p n d; do [ -e "$f" ] && git add -A "$f"; done
          git diff --staged --quiet && exit 0
          git commit -m "Refresh project data"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
