name: Refresh project data

on:
  workflow_dispatch:        # the "Run workflow" button
    inputs:
      backfill_weeks:
        description: "Also read older weekly permit reports, this many weeks back (0 = just the new ones)"
        required: false
        default: "0"
  schedule:
    - cron: "0 12 * * *"    # every day, about 5am Pacific

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Unit counts and job values from the city's weekly permit reports.
      # If the city's site is down, this step fails on its own and the sheet
      # still gets published below.
      - name: Read the city's weekly permit reports
        continue-on-error: true
        env:
          BACKFILL_WEEKS: ${{ github.event.inputs.backfill_weeks || '0' }}
        run: |
          pip install --quiet pdfplumber
          python3 permit_reports.py --backfill-weeks "$BACKFILL_WEEKS"

      - run: python3 build.py

      - name: Save the new data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add projects.json data/
          git diff --staged --quiet || git commit -m "Refresh project data"
          git push
